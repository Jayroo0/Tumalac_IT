<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Logged Out - PDRRMO</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .logout-card {
            background: rgba(255, 255, 255, 0.98);
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2) !important;
        }
        .icon-wrapper {
            background-color: #f0fdf4;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto;
            border: 2px solid #bbf7d0;
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
            border-radius: 0.5rem;
            padding: 0.7rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card p-4 p-sm-5 text-center logout-card" style="width: 100%; max-width: 440px;">
        <div class="mb-4">
            <div class="icon-wrapper">
                <i class="fa-solid fa-shield-halved fa-2x text-success"></i>
            </div>
        </div>
        
        <h3 class="fw-bold text-dark mb-2">Session Terminated</h3>
        <p class="text-muted small px-3 mb-4">
            You have securely logged out of the <strong>PDRRMO Fleet Management Portal</strong>. Cache storage and credential tokens for this session have been cleared.
        </p>
        
        <div class="pt-2 border-top border-light-subtle">
            <a href="{% url 'homepage' %}" class="btn btn-primary w-100 text-uppercase tracking-wide">
                <i class="fa-solid fa-arrow-left-long me-2"></i>Return to Homepage
            </a>
        </div>
    </div>

</body>
</html>
