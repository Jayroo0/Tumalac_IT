<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDRRMO Fleet Control | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Corporate Command Center Layout Engine */
        :root {
            --brand-blue: #0f172a;       /* Corporate Slate Navy */
            --brand-orange: #ea580c;     /* Alert Orange Accent */
            --brand-bg: #f1f5f9;         /* Clean Executive Gray Canvas */
            --text-main: #0f172a;        /* High-Definition Slate Text */
            --pdrrmo-blue-accent: #0076c0; /* Blue taken from PDRRMO logo hands */
        }

        body { 
            background-color: var(--brand-bg); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
        }

        .login-card { 
            border: 1px solid #cbd5e1;
            border-top: 5px solid var(--brand-blue); /* Emphasis bar matching stat boxes */
            background-color: #ffffff; 
            border-radius: 8px; 
            padding: 30px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 400px;
        }

        /* Standardized Form Inputs */
        .form-control {
            border-color: #cbd5e1;
            padding: 12px;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: var(--pdrrmo-blue-accent);
            box-shadow: 0 0 0 0.25rem rgba(0, 118, 192, 0.25);
        }

        /* Executive Command Button */
        .btn-command { 
            background-color: var(--brand-blue); 
            color: #ffffff; 
            border: none; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px;
            transition: all 0.15s ease-in-out;
        }
        .btn-command:hover { 
            background-color: #1e293b; /* Slightly lighter slate navy */
            color: #ffffff;
        }

        /* Secondary Public Hub Action */
        .btn-public-hub {
            border: 1px solid #cbd5e1;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            padding: 10px;
            background-color: #f8fafc;
            transition: all 0.15s ease-in-out;
            text-decoration: none;
        }
        .btn-public-hub:hover {
            background-color: #f1f5f9;
            color: var(--pdrrmo-blue-accent);
            border-color: #94a3b8;
        }

        .system-title {
            color: var(--brand-blue);
            font-weight: 800;
            letter-spacing: -0.02em;
            font-size: 1.5rem;
        }

    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="login-card">
        <div class="text-center mb-4">
            <img src="login_img.jpg" alt="Palawan PDRRMO Logo" style="max-height: 120px; width: auto;">
        </div>

        <div class="border-bottom pb-3 mb-4 text-center">
            <h1 class="system-title m-0">FLEET CONTROL CENTER</h1>
            <p class="text-uppercase text-secondary fw-bold small m-0" style="letter-spacing: 1px;">Secure Logistics Window Access</p>
        </div>
        
        <form method="post" action="{% url 'dashboard_portal:login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold text-uppercase">Operator Designation</label>
                <input type="text" name="username" class="form-control" placeholder="Enter Username" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold text-uppercase">Authorization Key</label>
                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>
            
            <button type="submit" class="btn btn-command w-100 shadow-sm mb-3">Authorize & Sign In</button>
            
            <a href="{% url 'dashboard_portal:homepage' %}" class="btn btn-public-hub d-flex align-items-center justify-content-center w-100 gap-1 shadow-sm">
                Return to Homepage Feed
            </a>
        </form>

        <div class="text-center mt-4 pt-3 border-top text-muted small">
            Palawan Provincial Disaster Risk Reduction and Management Office
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
