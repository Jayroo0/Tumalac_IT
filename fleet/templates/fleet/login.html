<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>PDRRMO Fleet Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border: none;
            border-radius: 1rem;
        }
        .form-control {
            border-radius: 0.5rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card p-4 p-sm-5 shadow-lg login-card" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-1">PDRRMO FLEET</h3>
            <p class="text-muted small mb-0">Emergency Response Portal</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 text-uppercase tracking-wide">
                Sign In
            </button>
        </form>
    </div>

</body>
</html>
