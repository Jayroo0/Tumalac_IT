<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PDRRMO Fleet Portal Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1e2f 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .form-control, .input-group-text {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
        }
        .form-control:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
        }
        .form-control::placeholder {
            color: #64748b !important;
        }
        .input-group-text {
            color: #94a3b8 !important;
        }
        .btn-login {
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-login:hover {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(1px);
        }
        .back-link {
            color: #94a3b8;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="card login-card p-4 p-sm-5 rounded-4 text-center shadow-lg" style="max-width: 440px; width: 100%;">
    <div class="mb-4">
        <div class="position-relative d-inline-block mb-3">
            <img src="https://img.icons8.com/color/96/shield.png" alt="PDRRMO Shield" style="width: 80px; height: 80px;">
        </div>
        <h2 class="fw-bold text-white mb-1 tracking-wide" style="letter-spacing: 0.5px;">PDRRMO FLEET</h2>
        <p class="text-info small fw-semibold text-uppercase tracking-wider" style="font-size: 0.75rem; letter-spacing: 1px;">Emergency Response Operations Portal</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="mb-3 text-start">
            <label class="form-label text-slate-300 small fw-semibold text-light-emphasis">Operator Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
                <input type="text" name="username" class="form-control py-2" placeholder="Enter credentials" required autofocus>
            </div>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label text-slate-300 small fw-semibold text-light-emphasis">Security Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control py-2" placeholder="••••••••" required>
            </div>
        </div>

        <div class="mb-2">
            <button type="submit" class="btn btn-login btn-primary w-100 fw-bold py-25 rounded-3 shadow-sm text-uppercase tracking-wide">
                Authorize Sign In
            </button>
        </div>
    </form>

    <div class="mt-4 border-top border-secondary border-opacity-25 pt-3">
        <a href="{% url 'homepage' %}" class="back-link small text-decoration-none d-inline-flex align-items-center gap-2">
            <i class="fa-solid fa-arrow-left-long"></i> Return to Live Fleet View
        </a>
    </div>
</div>

</body>
</html>
