<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PDRRMO Fleet Portal Login</title>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow-lg rounded-3 p-4 bg-white" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <div class="text-danger mb-2"><i class="fa-solid fa-shield-halved fa-3x"></i></div>
            <h4 class="fw-bold text-dark mb-1">PDRRMO FLEET</h4>
            <p class="text-muted small">Emergency Response Operations Portal</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger border-0 small py-2">
            <i class="fa fa-triangle-exclamation me-1"></i> Invalid credentials. Please try again.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %} <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa fa-user"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa fa-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm">
                Access Console <i class="fa-solid fa-right-to-bracket ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'homepage' %}" class="text-secondary small text-decoration-none"><i class="fa fa-arrow-left me-1"></i> Back to Fleet View</a>
        </div>
    </div>
</body>
</html>
