<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PDRRMO Fleet Portal Login</title>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow p-4 rounded-3 text-center" style="max-width: 450px; width: 100%;">
    <div class="mb-4">
        <img src="https://img.icons8.com/color/96/shield.png" alt="PDRRMO Shield" class="mb-2">
        <h2 class="fw-bold text-dark mb-1">PDRRMO FLEET</h2>
        <p class="text-muted small">Emergency Response Operations Portal</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="mb-3 text-start">
            <label class="form-label text-secondary small fw-bold">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter operator username" required autofocus>
            </div>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label text-secondary small fw-bold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
                Sign In
            </button>
        </div>
    </form>

    <div class="mt-3">
        <a href="{% url 'homepage' %}" class="text-secondary small text-decoration-none d-inline-flex align-items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> Back to Fleet View
        </a>
    </div>
</div>
</body>
</html>
